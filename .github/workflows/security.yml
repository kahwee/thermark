name: Dependency security

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security.yml
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check locked dependencies against current advisories
        # Keep unmaintained notices visible; ab_glyph currently depends on
        # ttf-parser (RUSTSEC-2026-0192), with no patched upstream version.
        # Vulnerabilities fail by default; also reject unsound/yanked crates.
        run: cargo audit --deny unsound --deny yanked
