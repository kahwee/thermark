name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

    - name: Build (default features)
      run: cargo build --verbose

    - name: Test (default features)
      run: cargo test --verbose

    - name: Test library without hardware deps
      run: cargo test --lib --no-default-features --verbose

    - name: Test library with ble only
      run: cargo test --lib --no-default-features --features ble --verbose

    - name: Test library with serial only
      run: cargo test --lib --no-default-features --features serial --verbose
