name: Rust

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer commit replaces obsolete CI work on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Rust / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, macos]
    runs-on: ${{ matrix.platform == 'macos' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Install the validated stable release explicitly. The runner image can lag
    # behind `rust-version` in Cargo.toml and fail before testing the change.
    # Install the toolchain and Linux libraries concurrently before restoring Cargo cache.
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Test release metadata guard
      run: python3 scripts/test_check_release.py -v
    - name: Test hardware trial recording
      run: python3 scripts/test_hardware_trial.py -v
    - name: Test immutable release asset recovery
      run: python3 scripts/test_release_assets.py -v

    - parallel:
        - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
          with:
            toolchain: 1.99.0
            components: rustfmt, clippy
        - name: Install system dependencies
          if: runner.os == 'Linux'
          run: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # PRs can restore main's cache without storing a cache for every PR.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Show toolchain
      run: rustc --version && cargo --version

    - name: Validate Rust and feature matrix
      run: scripts/check-ci.sh

    - name: Cargo registry preflight (Linux)
      if: runner.os == 'Linux'
      run: |
        python3 scripts/test_check_package.py -v
        python3 scripts/check-package.py
        cargo publish --locked --dry-run

    - name: Verify documentation images
      run: python3 scripts/render-docs.py --check

    - name: Upload failed render images
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: golden-actual-${{ matrix.platform }}
        path: target/golden-actual/
        if-no-files-found: ignore
        retention-days: 7
