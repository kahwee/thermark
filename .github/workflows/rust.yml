name: Rust

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer commit replaces obsolete CI work on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Rust / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, macos]
    runs-on: ${{ matrix.platform == 'macos' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Install the validated stable release explicitly. The runner image can lag
    # behind `rust-version` in Cargo.toml and fail before testing the change.
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        toolchain: 1.99.0
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # PRs can restore main's cache without storing a cache for every PR.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Show toolchain
      run: rustc --version && cargo --version

    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

    - name: Validate Rust and feature matrix
      run: scripts/check.sh all

    - name: Upload failed render images
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: golden-actual-${{ matrix.platform }}
        path: target/golden-actual/
        if-no-files-found: ignore
        retention-days: 7
