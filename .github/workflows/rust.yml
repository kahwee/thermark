name: Rust

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer commit replaces obsolete CI work on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","Linux","X64","thermark-ci"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Install stable explicitly. The runner image ships some Rust, but it can
    # lag behind the `rust-version` in Cargo.toml, and then the build fails for
    # a reason unrelated to the change under test.
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      if: runner.environment == 'github-hosted'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # PRs can restore main's cache without storing a cache for every PR.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Show toolchain
      run: rustc --version && cargo --version

    - name: Install system dependencies
      if: runner.environment == 'github-hosted'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

    - name: Use persistent local build artifacts
      if: runner.environment == 'self-hosted'
      run: echo "CARGO_TARGET_DIR=$HOME/.cache/thermark-target" >> "$GITHUB_ENV"

    - name: Validate Rust and feature matrix
      run: scripts/check.sh all

    - name: Upload failed render images
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: golden-actual
        path: ${{ env.CARGO_TARGET_DIR || 'target' }}/golden-actual/
        if-no-files-found: ignore
        retention-days: 7
