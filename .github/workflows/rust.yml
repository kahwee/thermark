name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Install stable explicitly. The runner image ships some Rust, but it can
    # lag behind the `rust-version` in Cargo.toml, and then the build fails for
    # a reason unrelated to the change under test.
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Show toolchain
      run: rustc --version && cargo --version

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Build (default features)
      run: cargo build --verbose

    - name: Test (default features)
      run: cargo test --verbose

    - name: Test library without hardware deps
      run: cargo test --lib --no-default-features --verbose

    - name: Test library with ble only
      run: cargo test --lib --no-default-features --features ble --verbose

    - name: Test library with serial only
      run: cargo test --lib --no-default-features --features serial --verbose

    - name: Build BLE-only binary
      run: cargo build --bin thermark --no-default-features --features ble --verbose

    - name: Build serial-only binary
      run: cargo build --bin thermark --no-default-features --features serial --verbose
