[package]
name = "thermark"
version = "0.1.0"
edition = "2021"
description = "Local BLE/USB thermal label printing (QR, text, calibration) without vendor apps"
license = "MIT"
readme = "README.md"
keywords = ["thermal", "label", "bluetooth", "ble", "printer"]
categories = ["hardware-support", "command-line-utilities"]

[[bin]]
name = "thermark"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
btleplug = "0.11"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
log = "0.4"
qrcode = "0.14"
ab_glyph = "0.2"
serialport = "4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
