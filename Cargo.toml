[package]
name = "thermark"
version = "0.1.0"
edition = "2021"
description = "Local BLE/USB thermal label printing (QR, text, calibration) without vendor apps"
license = "MIT"
readme = "README.md"
keywords = ["thermal", "label", "bluetooth", "ble", "printer"]
categories = ["hardware-support", "command-line-utilities"]
repository = "https://github.com/kahwee/thermark"

[features]
default = ["ble", "serial"]
# Bluetooth LE (btleplug). On Linux needs libdbus-1-dev.
ble = ["dep:btleplug", "dep:futures", "dep:uuid"]
# USB serial. On Linux needs libudev-dev.
serial = ["dep:serialport"]

[[bin]]
name = "thermark"
path = "src/main.rs"
required-features = ["ble", "serial"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
qrcode = "0.14"
ab_glyph = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Optional transports (enable via features)
btleplug = { version = "0.11", optional = true }
futures = { version = "0.3", optional = true }
serialport = { version = "4", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[profile.release]
lto = true
codegen-units = 1
