[package]
name = "thermark"
version = "0.33.0"
edition = "2024"
# Minimum supported Rust, not a request for a particular toolchain. Set to the
# current stable so new language features can be used freely; the cost is that
# anyone on an older toolchain cannot build, which is deliberate for a personal
# CLI. CI installs stable explicitly so this stays honest.
rust-version = "1.98"
description = "Local sticker printing for pocket thermal printers over BLE/USB — QR links, inventory tags, badges, photos; no vendor app"
license = "MIT"
readme = "README.md"
keywords = ["thermal", "label", "bluetooth", "ble", "printer"]
categories = ["hardware-support", "command-line-utilities"]
repository = "https://github.com/kahwee/thermark"
# Publish the usable source distribution, including offline tests and licenses.
# Personal output and runner infrastructure must never enter a registry package.
# Keep local/README.md: the Wi-Fi save guard points at it; ignore real prints.
include = [
    "/src/**", "/benches/**", "/examples/**", "/tests/**", "/fixtures/**",
    "/docs/*.md", "/scripts/**", "/Cargo.toml", "/Cargo.lock",
    "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/AGENTS.md", "/LICENSE",
    "/rust-toolchain.toml", "/local/README.md",
]

[package.metadata.docs.rs]
all-features = false
no-default-features = true

[features]
default = ["ble", "serial"]
# Bluetooth LE (btleplug). On Linux needs libdbus-1-dev.
ble = ["dep:btleplug", "dep:futures", "dep:uuid"]
# USB serial. Linux enumeration uses the crate's sysfs fallback (no libudev).
serial = ["dep:serialport", "dep:tokio-serial"]

[[bin]]
name = "thermark"
path = "src/main.rs"

[[bench]]
name = "image_pipeline"
harness = false

[[bench]]
name = "packet_decoder"
harness = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
qrcode = { version = "0.14", default-features = false }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"

# Optional transports (enable via features)
btleplug = { version = "0.13.2", optional = true }
futures = { version = "0.3", optional = true }
serialport = { version = "4", optional = true, default-features = false }
tokio-serial = { version = "5", optional = true }
uuid = { version = "1", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
quircs = "0.10.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
manual_let_else = "warn"
redundant_clone = "warn"
unused_async = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
