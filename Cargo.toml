[package]
name = "thermark"
version = "0.22.0"
edition = "2024"
# Minimum supported Rust, not a request for a particular toolchain. Set to the
# current stable so new language features can be used freely; the cost is that
# anyone on an older toolchain cannot build, which is deliberate for a personal
# CLI. CI installs stable explicitly so this stays honest.
rust-version = "1.97"
description = "Local sticker printing for pocket thermal printers over BLE/USB — QR links, inventory tags, badges, photos; no vendor app"
license = "MIT"
readme = "README.md"
keywords = ["thermal", "label", "bluetooth", "ble", "printer"]
categories = ["hardware-support", "command-line-utilities"]
repository = "https://github.com/kahwee/thermark"

[features]
default = ["ble", "serial"]
# Bluetooth LE (btleplug). On Linux needs libdbus-1-dev.
ble = ["dep:btleplug", "dep:futures", "dep:uuid"]
# USB serial. On Linux needs libudev-dev.
serial = ["dep:serialport"]

[[bin]]
name = "thermark"
path = "src/main.rs"
required-features = ["ble", "serial"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
qrcode = "0.14"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Optional transports (enable via features)
btleplug = { version = "0.12", optional = true }
futures = { version = "0.3", optional = true }
serialport = { version = "4", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
